name: Build
'on':
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/gradle-build.yml@main
    with:
      java-version: "21"
      java-distribution: temurin
      gradle-tasks: build verifyPlugin
      pre-script: ./scripts/check-update-descriptor.sh
      artifact-name: plugin
      artifact-path: build/distributions/*.zip
