# Terminal title notifier
settings.terminal.title.notifier.display.name=Terminal Title Notifier
settings.terminal.title.notifier.patterns.label=Notify when a terminal title contains one of these strings (one per line):
settings.terminal.title.notifier.patterns.comment=Case-sensitive. Leading and trailing spaces of each line are ignored. \
  Both the tab name and the title set by the running program are checked. \
  <br/><b>Remote development:</b> the plugin must be installed in the JetBrains Client, not only on the host. \
  Reworked terminals only exist on the client side: without the plugin there, they are never watched. \
  Classic terminals are watched on the host. The list is synchronised between both sides.
notification.group.terminal.title=Terminal title matched
notification.terminal.title.matched.title=Terminal needs attention ({0})
notification.terminal.title.matched.action.show=Show terminal
