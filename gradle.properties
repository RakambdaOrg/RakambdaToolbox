# Plugin coordinates
pluginGroup=fr.rakambda
pluginVersion=2.0.1
# Lowest IDE build the plugin declares compatibility with.
# Must match the major build of platformVersion, otherwise the plugin compiles against APIs absent from older IDEs.
pluginSinceBuild=262
# IDE the plugin is compiled and run against -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-dependencies-extension.html
platformType=IU
platformVersion=2026.2
# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
