name: Release
'on':
  release:
    types:
      - published
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
    uses: RakambdaOrg/rakambda-github-workflows/.github/workflows/gradle-release-upload.yml@main
    with:
      tag: ${{ github.event.release.tag_name }}
      java-version: "21"
      java-distribution: temurin
      pre-script: |
        version="$(grep -E '^pluginVersion=' gradle.properties | cut -d= -f2-)"
        if [[ "$RELEASE_TAG" != "v${version}" ]]; then
          echo "Tag $RELEASE_TAG does not match pluginVersion ${version} (expected v${version})"
          exit 1
        fi
        ./scripts/check-update-descriptor.sh
      gradle-tasks: buildPlugin
      upload-glob: build/distributions/*.zip
